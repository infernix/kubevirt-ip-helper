apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Disposable e2e overlay for kubevirt-ip-helper. Layered on top of the
# production manifests so the run exercises the same CRD/RBAC shape operators
# get, with e2e specific overrides below.
# Render with:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone test/e2e/manifests
# The production resources live above this kustomization root.
resources:
  - ../../../deployments/deployment.yaml
  - ../../../deployments/webhook-deployment.yaml
  - namespaces.yaml
  - nad.yaml
  - network-services.yaml

patches:
  # Primary HA fixture has two replicas; all other runtime defaults remain.
  - path: helper-overlay.yaml
  - target:
      kind: Service
      name: metrics-management
    patch: |-
      - op: replace
        path: /metadata/labels/kubevirtiphelper~1network
        value: kubevirt-ip-helper-e2e
      - op: replace
        path: /spec/selector/kubevirtiphelper~1network
        value: kubevirt-ip-helper-e2e
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helper-storage
        namespace: kubevirt-ip-helper
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: metrics-storage
        namespace: kubevirt-ip-helper
      $patch: delete
  # The webhook is a cluster singleton which watches dhcp, because the estate
  # catalogue moves every NAD and IPPool into dhcp. Its own objects therefore run
  # in dhcp while the helper daemon stays in kubevirt-ip-helper: this is
  # KIH_WEBHOOK_NAMESPACE in versions.env. The kustomize namespace transformer
  # cannot be applied selectively (it would also move the helper, the NADs and the
  # kube-system cabundle Role/RoleBinding), so every webhook object is moved
  # explicitly here. The cabundle Role/RoleBinding stay in kube-system on purpose:
  # the webhook reads kube-system/kube-root-ca.crt, so only their subjects move.
  - target:
      kind: ServiceAccount
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dhcp
  - target:
      kind: Service
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dhcp
  - target:
      kind: Role
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dhcp
  - target:
      kind: RoleBinding
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dhcp
      - op: replace
        path: /subjects/0/namespace
        value: dhcp
  - target:
      kind: ClusterRoleBinding
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: dhcp
  - target:
      kind: RoleBinding
      name: kubevirt-ip-helper-webhook-cabundle
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: dhcp
  - target:
      kind: Deployment
      name: kubevirt-ip-helper-webhook
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dhcp
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubevirt-ip-helper-webhook
        namespace: dhcp
      spec:
        template:
          spec:
            containers:
              - name: kubevirt-ip-helper-webhook
                image: kubevirt-ip-helper-webhook:e2e
                imagePullPolicy: IfNotPresent

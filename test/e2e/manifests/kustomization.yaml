apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Disposable e2e overlay for kubevirt-ip-helper. Layered on top of the
# production manifests so the run exercises the same CRD/RBAC shape operators
# get, with e2e specific overrides below.
# Render with:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone test/e2e/manifests
# The production resources live above this kustomization root.
resources:
  - ../../../deployments/deployment.yaml
  - ../../../deployments/webhook-deployment.yaml
  - namespaces.yaml
  - nad.yaml
  - network-services.yaml

patches:
  # Primary HA fixture has two replicas; all other runtime defaults remain.
  - path: helper-overlay.yaml
  - target:
      kind: Service
      name: metrics-management
    patch: |-
      - op: replace
        path: /metadata/labels/kubevirtiphelper~1network
        value: kubevirt-ip-helper-e2e
      - op: replace
        path: /spec/selector/kubevirtiphelper~1network
        value: kubevirt-ip-helper-e2e
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helper-storage
        namespace: kubevirt-ip-helper
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: metrics-storage
        namespace: kubevirt-ip-helper
      $patch: delete
  # The webhook is a cluster singleton which watches dhcp, because the estate
  # catalogue moves every NAD and IPPool into dhcp. Its own objects therefore run
  # in dhcp while the helper daemon stays in kubevirt-ip-helper: this is
  # KIH_WEBHOOK_NAMESPACE in versions.env, and the production manifests carry
  # every namespace and subject themselves. No namespace patch is layered here:
  # the production objects are applied with their own namespaces, so a regression
  # in one of those fields fails the run instead of being concealed by an overlay
  # that rewrote it to the expected value. The cabundle Role/RoleBinding stay in
  # kube-system on purpose: the webhook reads kube-system/kube-root-ca.crt there,
  # while their subjects name the dhcp ServiceAccount.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubevirt-ip-helper-webhook
        namespace: dhcp
      spec:
        template:
          spec:
            containers:
              - name: kubevirt-ip-helper-webhook
                image: kubevirt-ip-helper-webhook:e2e
                imagePullPolicy: IfNotPresent

name: Build, tag, and push the v1.1.0-beta1 images to GHCR

# Publishes the images of the v1.1.0-beta1 tag (the network-scoped helper with the
# static ip annotation, E2E qualified) from the fork. The checkout pins the tag, so the
# published image is byte-identical to the tagged revision regardless of the branch tip.
on:
  push:
    branches:
      - release/v1.1.x
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the tagged release revision
        uses: actions/checkout@v7
        with:
          ref: v1.1.0-beta1

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag and push the helper image
        run: |
          sha="$(git rev-parse --short=8 HEAD)"
          image="${REGISTRY}/${{ github.repository }}"
          docker build -f build/Dockerfile -t "${image}:${sha}" .
          docker push "${image}:${sha}"
          docker tag "${image}:${sha}" "${image}:v1.1.0-beta1"
          docker push "${image}:v1.1.0-beta1"

      - name: Build, tag and push the webhook image
        run: |
          sha="$(git rev-parse --short=8 HEAD)"
          image="${REGISTRY}/${{ github.repository }}-webhook"
          docker build -f build/Dockerfile.webhook -t "${image}:${sha}" .
          docker push "${image}:${sha}"
          docker tag "${image}:${sha}" "${image}:v1.1.0-beta1"
          docker push "${image}:v1.1.0-beta1"

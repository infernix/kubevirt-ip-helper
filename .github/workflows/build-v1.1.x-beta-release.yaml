name: Build, tag, and push the v1.1.0-beta images to GHCR

# Publishes the images of a v1.1.0-beta tag from the fork. The checkout pins the pushed
# tag, so the published image is byte-identical to the tagged revision regardless of any
# branch tip. workflow_dispatch republishes an existing tag on demand.
on:
  push:
    tags:
      - 'v1.1.0-beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.1.0-beta2)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the tagged release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag and push the helper image
        run: |
          sha="$(git rev-parse --short=8 HEAD)"
          image="${REGISTRY}/${{ github.repository }}"
          docker build -f build/Dockerfile -t "${image}:${sha}" .
          docker push "${image}:${sha}"
          docker tag "${image}:${sha}" "${image}:${IMAGE_TAG}"
          docker push "${image}:${IMAGE_TAG}"

      - name: Build, tag and push the webhook image
        run: |
          sha="$(git rev-parse --short=8 HEAD)"
          image="${REGISTRY}/${{ github.repository }}-webhook"
          docker build -f build/Dockerfile.webhook -t "${image}:${sha}" .
          docker push "${image}:${sha}"
          docker tag "${image}:${sha}" "${image}:${IMAGE_TAG}"
          docker push "${image}:${IMAGE_TAG}"
